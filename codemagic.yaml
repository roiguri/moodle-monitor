# Codemagic CI/CD configuration for Moodie Monitor
#
# This file defines the workflow for building and testing the iOS application.
# It uses Codemagic's cloud-hosted macOS machines to run Xcode builds.

workflows:
  ios-sideload-build:
    name: iOS Ad Hoc Build (Sideload)
    # Runner type (Mac mini M2 is fast and included in the free tier)
    instance_type: mac_mini_m2
    
    # Environment variables for build settings
    environment:
      vars:
        # This variable is for the Flutter build command to ensure the app ID is correct.
        # REPLACE this with your actual Bundle ID (e.g., app.moodie).
        # The default Flutter bundle ID is com.example.moodie.
        BUNDLE_ID: "com.example.moodie"
        EXPORT_OPTIONS_PLIST: "$CM_BUILD_DIR/ExportOptions.plist"
        DEVELOPMENT_TEAM_ID: "ZU59K45T66"
      flutter: stable
      xcode: latest
      cocoapods: default

    # Triggers the build automatically when changes are pushed to the main branch
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    # Steps in the build process
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      
      - name: Install Pods
        script: |
          # Install native dependencies defined in the Podfile
          cd ios
          pod install --repo-update
        
      - name: Configure iOS Code Signing
        # NOTE: This step is typically handled by Codemagic's UI settings 
        # (integrating your Apple ID and provisioning profiles).
        # We leave the script minimal, as AltStore handles the final signing.
        script: |
          echo "Configuring code signing for bundle ID: $BUNDLE_ID"

      - name: Create Export Options Plist
        # We ensure the file is created using the environment variable
        script: |
          cat << EOF > $EXPORT_OPTIONS_PLIST
           <?xml version="1.0" encoding="UTF-8"?>
           <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
           <plist version="1.0">
           <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
           </dict>
           </plist>
           EOF
          
      - name: Flutter Build IPA
        script: |
          # This command builds the final iOS archive (.ipa) that you can sideload.
          # We use the '--no-codesign' flag here as AltStore handles the signing locally.
          # We explicitly save the archive to a clean, known path
          flutter build ipa --release \
            --target=lib/main.dart \
            --build-name=1.0.0 \
            --build-number=$CM_BUILD_NUMBER \
            --no-codesign
      - name: Extract IPA from Archive
        script: |
            # 1. Find the generated archive path created by 'flutter build ipa --no-codesign'
            ARCHIVE_PATH=$(find $CM_BUILD_DIR/build/ios/archive -name "*.xcarchive" | head -n 1)

            # 2. Define the final output directory for the IPA
            IPA_OUTPUT_DIR="$CM_BUILD_DIR/build/ios/ipa"
            mkdir -p "$IPA_OUTPUT_DIR"
            
            # 3. Use the native Apple tool (xcrun xcodebuild) to export the IPA 
            #    using our custom ExportOptions.plist (which contains 'method: development')
            xcrun xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
              -exportPath "$IPA_OUTPUT_DIR"

    # Output the final app file
    artifacts:
      - build/ios/ipa/*.ipa
